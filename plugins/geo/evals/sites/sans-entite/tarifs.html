<h2>Que coûte une restauration ?</h2>
<p>Une restauration est un travail sur mesure dont le prix dépend de l'état du livre. Nous établissons un devis gratuit après examen.</p>
<h2>Comment payer ?</h2>
<p>Selon <a href="https://www.exemple-guide.example/tarifs">le barème des artisans d'art</a>, un acompte de trente pour cent est d'usage.</p>
